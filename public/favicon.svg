      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bulb only -->
  <g transform="translate(4,4) scale(0.7)">
    <path
      d="M 16 4
         C 11 4, 8 7, 8 12
         C 8 15, 9.5 17, 11 18.5
         L 11 21
         C 11 22, 12 23, 13 23
         L 19 23
         C 20 23, 21 22, 21 21
         L 21 18.5
         C 22.5 17, 24 15, 24 12
         C 24 7, 21 4, 16 4 Z"
      fill="url(#bulbCore)"
    />

    <ellipse cx="13" cy="10" rx="3.5" ry="4.5" fill="url(#highlight)" />

    <!-- Base -->
    <rect x="12" y="23" width="8" height="1.5" fill="#94A3B8"/>
    <rect x="12" y="24.5" width="8" height="1" fill="#78849B"/>
    <rect x="12" y="25.5" width="8" height="1.5" fill="#64748B"/>
    <rect x="13" y="27" width="6" height="1.5" rx="0.5" fill="#475569"/>
