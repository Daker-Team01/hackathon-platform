<svg width="128" height="128" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bulb gradient -->
    <radialGradient id="bulbCore" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFDEB"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="65%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <!-- Highlight -->
